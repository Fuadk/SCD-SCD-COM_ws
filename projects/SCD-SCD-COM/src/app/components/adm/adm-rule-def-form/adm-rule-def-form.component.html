<div>
    <legend *ngIf="!componentConfig.isMaster" class="k-form-legend">{{ title }}</legend>

<kendo-toolbar class="form-toolbar" *ngIf="showToolBar">
    <kendo-toolbar-button kendoButton [icon]="'save'" title="{{starServices.getNLS([],'SAVE','Save')}}" (click)="saveChanges( form)" *ngIf="!isChild && !isSearch"></kendo-toolbar-button>
   


    <kendo-toolbar-button  [disabled]="isSearch" text="{{starServices.getNLS([],'ENTER_QUERY','Enter Query')}}" title="{{starServices.getNLS([],'ENTER_QUERY','Enter Query')}}" title="Enter Query" (click)="enterQuery( form);"></kendo-toolbar-button>
    <kendo-toolbar-button  [icon]="'zoom'" title="{{starServices.getNLS([],'EXECUTE_QUERY','Execute Query')}}"  (click)="executeQuery( form.value);"></kendo-toolbar-button>
    <kendo-toolbar-button  [icon]="'cancel'" title="Cancel"  (click)="onCancel($event)" ></kendo-toolbar-button >

    <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-double-60-right' : 'arrow-double-60-left'" title="First Record" (click)="goRecord( 'first');" *ngIf="!isSearch"></kendo-toolbar-button>
    <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-60-right' : 'arrow-60-left'"  title="Previous Record"  (click)="goRecord(  'prev');" *ngIf="!isSearch"></kendo-toolbar-button>
    <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-60-left' : 'arrow-60-right'" title="Next Record"  (click)="goRecord('next')" *ngIf="!isSearch"></kendo-toolbar-button >
    <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-double-60-left' : 'arrow-double-60-right'" title="Last Record" (click)="goRecord('last')" *ngIf="!isSearch"></kendo-toolbar-button>

    <kendo-toolbar-button [icon]="'plus'" title="{{starServices.getNLS([],'INSERT_RECORD','Insert Record')}}" (click)="onNew($event);" *ngIf="!isSearch"></kendo-toolbar-button>
    <kendo-toolbar-button [icon]="'trash'" title="{{starServices.getNLS([],'DELETE_RECORD','Delete Record')}}" (click)="onRemove( form);" *ngIf="!isSearch">Remove</kendo-toolbar-button>
    <kendo-toolbar-button  kendoButton [icon]="'print'" title="print" (click)="printScreen()" ></kendo-toolbar-button >
    <kendo-toolbar-button  kendoButton [icon]="'preview-off'" title="Hide/Show Rules" (click)="toggleShowAll();" ></kendo-toolbar-button >
<kendo-toolbar-button kendoButton  *ngIf="starServices.helpMsg !=='' "  text="{{starServices.helpMsg}}"    ></kendo-toolbar-button>		
</kendo-toolbar>

<kendo-pdf-export #pdf paperSize="A4" margin="2cm">
    <form class="form-layout" class="k-form k-form-horizontal" [formGroup]="form" >
    <fieldset class="form-fieldset"  class="k-form-fieldset">



<div [ngClass]="isPhonePortrait ? 'standard' : 'wrap' ">
    
	<kendo-formfield  class="form-field" [orientation]="'horizontal'" >
		<kendo-label class="form-label" [for]="MODULE" text="Module"></kendo-label>
		<kendo-combobox  #MODULE class="form-field-combobox-1" [formControlName]="'MODULE'"
		[data]="lkpArrMODULE" [textField]="'CODETEXT_LANG'"  [valueField]="'CODE'"

		[ngClass]="{ 'ng-invalid-required  ng-touched': submitted && f.MODULE.errors }"  required 
		[readonly]="primarKeyReadOnlyArr.isMODULEreadOnly"
		[valuePrimitive]="true"  [kendoDropDownFilter]="{ operator: 'contains' }">
		</kendo-combobox>
	</kendo-formfield>

	<kendo-formfield  class="form-field" [orientation]="'horizontal'" >
		<kendo-label class="form-label" [for]="RULE_ID" text="Rule Id"></kendo-label>
        <input class="form-input" formControlName="RULE_ID" kendoTextBox #RULE_ID
        [readonly]="primarKeyReadOnlyArr.isRULE_IDreadOnly"
        [ngClass]="{ 'ng-invalid-required  ng-touched': submitted && f.MODULE.errors }" />
    </kendo-formfield>

    <kendo-formfield class="form-field" [orientation]="'horizontal'">
        <kendo-label class="form-label" [for]="DISABLED" text="Active"></kendo-label>
        <!-- <kendo-switch formControlName="DISABLED" #DISABLED
         ToggleValue  [true]= "0" [false]= "1" ></kendo-switch> -->
        <input class="form-input" formControlName="DISABLED"  #DISABLED kendoCheckBox 
        ToggleValue  [true]= "0" [false]= "1" 
        type="checkbox"/>
    </kendo-formfield>


   
</div>
<div [ngClass]="isPhonePortrait ? 'standard' : 'wrap' "> 
    <kendo-formfield class="form-field"  [orientation]="'horizontal'" >
    <kendo-label class="form-label" [for]="QUERY_DEF" text="Transact."></kendo-label>
    <kendo-combobox  #QUERY_DEF class="form-field-combobox-1" [formControlName]="'QUERY_DEF'"
    [data]="lkpArrQUERY_DEF" [textField]="'CODETEXT_LANG'"  [valueField]="'CODE'"
    (valueChange)="valueChangeQUERY_DEF($event)"
    [ngClass]="{ 'ng-invalid-required  ng-touched': submitted && f.QUERY_DEF.errors }"
    [valuePrimitive]="true"  [kendoDropDownFilter]="{ operator: 'contains' }">
    </kendo-combobox>
</kendo-formfield>

    <kendo-formfield class="form-field"  [orientation]="'horizontal'">
    <kendo-label class="form-label" [for]="RULE_DESCRIPTION" text="Descr."></kendo-label>
    <input class="form-input" formControlName="RULE_DESCRIPTION" kendoTextBox #RULE_DESCRIPTION 
    />
</kendo-formfield>



     <kendo-formfield class="form-field" [orientation]="'horizontal'" >
		<kendo-label class="form-label" [for]="RULE_TRIGGER" text="Trigger"></kendo-label>
		<kendo-combobox  #RULE_TRIGGER class="form-field-combobox" [formControlName]="'RULE_TRIGGER'"
		[data]="lkpArrRULE_TRIGGER" [textField]="'CODETEXT_LANG'"  [valueField]="'CODE'"
		[ngClass]="{ 'ng-invalid-required  ng-touched': submitted && f.RULE_TRIGGER.errors }"
		[valuePrimitive]="true"  [kendoDropDownFilter]="{ operator: 'contains' }">
		</kendo-combobox>
    </kendo-formfield>







</div>
<div [ngClass]="isPhonePortrait ? 'standard' : 'wrap' ">

       
        
    <kendo-formfield *ngIf="showAll" class="form-field" [orientation]="'horizontal'">
        <kendo-label class="form-label" [for]="TEMPLATE_NAME" text="Work flow"></kendo-label>
        <kendo-combobox  #TEMPLATE_NAME class="form-field-combobox" [formControlName]="'TEMPLATE_NAME'"
        [data]="lkpArrTEMPLATE_NAME" [textField]="'CODETEXT_LANG'"  [valueField]="'CODE'"
        [valuePrimitive]="true"  [kendoDropDownFilter]="{ operator: 'contains' }"
        [placeholder]="'select a Work Flow'"
        (valueChange)="valueChangeTEMPLATE_NAME($event)"
        >
        </kendo-combobox>
    </kendo-formfield>
    


        <kendo-formfield *ngIf="showAll" class="form-field" [orientation]="'horizontal'">
            <kendo-label class="form-label" [for]="SEQUENCE_NAME" text="Seq."></kendo-label>
            <kendo-combobox  #SEQUENCE_NAME class="form-field-combobox" [formControlName]="'SEQUENCE_NAME'"
            [data]="lkpArrSEQUENCE_NAME" [textField]="'CODETEXT_LANG'"  [valueField]="'CODE'"
            [valuePrimitive]="true"  [kendoDropDownFilter]="{ operator: 'contains' }"
            [placeholder]="'select Sequence'"
            (valueChange)="valueChangeSEQUENCE_NAME($event)"
            >
            </kendo-combobox>
        </kendo-formfield>

        <kendo-formfield *ngIf="showAll" class="form-field" [orientation]="'horizontal'" >
            <kendo-label class="form-label" [for]="RULE_KEY" text="Rule Key"></kendo-label>
            <input class="form-input" formControlName="RULE_KEY" kendoTextBox #RULE_KEY (click)="keysOpen()" 
            [ngClass]="{ 'ng-invalid-required  ng-touched': submitted && f.RULE_KEY.errors }" />
        </kendo-formfield>


</div>

<div [ngClass]="isPhonePortrait ? 'standard' : 'wrap' "> 
  
  
    <kendo-formfield *ngIf="showAll" class="form-field" [orientation]="'horizontal'" >
		<kendo-label class="form-label" [for]="ROUTINE_NAME" text="Routine"></kendo-label>
		<kendo-combobox  #ROUTINE_NAME class="form-field-combobox" [formControlName]="'ROUTINE_NAME'"
		[data]="lkpArrROUTINE" [textField]="'CODETEXT_LANG'"  [valueField]="'CODE'"
        [ngClass]="{ 'ng-invalid-required  ng-touched': submitted && f.ROUTINE_NAME.errors }"
        [placeholder]="'select routine'"
		[valuePrimitive]="true"  [kendoDropDownFilter]="{ operator: 'contains' }">
		</kendo-combobox>
    </kendo-formfield>  

   
    <kendo-formfield *ngIf="showAll" class="form-field" [orientation]="'horizontal'" >
        <kendo-label class="form-label" [for]="RESPONSE_DATA_ID" text="Resp. ID"></kendo-label>
        <input class="form-input" formControlName="RESPONSE_DATA_ID" kendoTextBox #RESPONSE_DATA_ID />
    </kendo-formfield>	
    
    <kendo-formfield *ngIf="showAll" class="form-field" [orientation]="'horizontal'" >
        <kendo-label class="form-label" [for]="RESPONSE_DATA_NAME" text="Data"></kendo-label>
        <input class="form-input" formControlName="RESPONSE_DATA_NAME" kendoTextBox #RESPONSE_DATA_NAME/>
    </kendo-formfield>
   
  
</div>







    </fieldset>
    </form>
</kendo-pdf-export>
</div>

<kendo-dialog title="Host Definition" *ngIf="hostOpened" (close)="hostClose()" 
[minWidth]="400" [width]="950" [height]="550">
	<app-adm-rules-hosts
	[detail_Input]="grid_adm_rule_host_def"  >
	</app-adm-rules-hosts>
  </kendo-dialog>

<div [hidden]="!keysOpened" >
  <kendo-dialog title="Keys" resizable="true" [minWidth]="400" [width]="500" [height]="450" (close)="keysClose()">
    <app-adm-rule-keys-grid
        (saveCompletedOutput)="saveCompletedHandler($event)" 
        [setComponentConfig_Input]="grid_adm_rule_keys">
    </app-adm-rule-keys-grid>
    <kendo-dialog-actions>
        <button class="k-button" (click)="onCancelKeys($event)">Cancel</button>
        <button class="k-button k-primary" (click)="onSaveKeys($event)">Save</button>
    </kendo-dialog-actions>
  </kendo-dialog>
</div>
