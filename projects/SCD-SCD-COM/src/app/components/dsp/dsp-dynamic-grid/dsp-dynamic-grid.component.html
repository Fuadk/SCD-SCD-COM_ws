<kendo-pdf-export #pdf paperSize="A4" margin="2cm">
<kendo-grid
id="grid"
[kendoGridBinding]="gridData"
  [filter]="state.filter"
  [filterable]= "isFilterable"
  [columnMenu]="isColumnMenu"
  [resizable]="true"
  [sortable]="true"

>


<ng-template kendoGridToolbarTemplate>
  <legend class="k-form-legend" >{{ title }}</legend>


  
  <button kendoButton [icon]="'save'" title="{{starServices.getNLS([],'SAVE','Save')}}" (click)="saveChanges(grid);" *ngIf="!isChild && !isSearch"></button >

  <kendo-toolbar-separator *ngIf="componentConfig.queryable"></kendo-toolbar-separator>
      <button  [disabled]="isSearch" kendoButton  title="Enter Query" (click)="enterQuery(grid);" *ngIf="componentConfig.queryable"></button >
      <button  kendoButton [icon]="'zoom'" title="{{starServices.getNLS([],'EXECUTE_QUERY','Execute Query')}}"  (click)="executeQuery(grid);" *ngIf="componentConfig.queryable"></button >
      <button  kendoButton [icon]="'cancel'" title="{{starServices.getNLS([],'CANCEL','Cancel')}}"  (click)="cancelHandler()" *ngIf="componentConfig.queryable" ></button >
  <kendo-toolbar-separator *ngIf="componentConfig.insertable"></kendo-toolbar-separator>

      <button  [icon]="'plus'" title="{{starServices.getNLS([],'INSERT_RECORD','Insert Record')}}"  kendoGridAddCommand *ngIf="componentConfig.insertable"></button >
      <button [icon]="'trash'" title="{{starServices.getNLS([],'DELETE_RECORD','Delete Record')}}"  kendoButton (click)="removeHandler($event)" *ngIf="componentConfig.insertable  && !isSearch">Remove</button >
  
      <button  kendoButton [icon]="'filter'" title="{{starServices.getNLS([],'SHOW_HIDE_FILTER_OPTIONS','Show/Hide Filter options')}}"  (click)="toggleFilter()" ></button >
                  <button  kendoButton [icon]="'menu'" title="{{starServices.getNLS([],'SHOW_HIDE_MENU','Show/Hide Menu')}}"  (click)="toggleColumnMenu()" *ngIf="!isSearch"></button >
            <div *ngIf="isColumnMenu">
      <button  [icon]="'file-pdf'" title="{{starServices.getNLS([],'EXPORT_TO_PDF','Export to PDF')}}"  kendoGridPDFCommand ></button >
      <button  [icon]="'file-excel'" title="{{starServices.getNLS([],'EXPORT_TO_EXCEL','Export to Excel')}}"  kendoGridExcelCommand ></button >
      </div>

</ng-template>

<kendo-grid-column
  *ngFor="let column of columns"
  field="{{column.field}}"
  title="{{column.title}}"
  format="{{column.format}}"
  
  >
  <p *ngIf="column.lookup">
    <ng-template kendoGridCellTemplate let-dataItem> {{lkpArrGetfield(column.field, dataItem)?.CODETEXT_LANG}} </ng-template>
  </p>

</kendo-grid-column>


<kendo-grid-pdf [fileName]="PDFfileName" [allPages]="true" paperSize="A3" [repeatHeaders]="true" [landscape]="true">
  <kendo-grid-pdf-margin top="2cm" left="1cm" right="1cm" bottom="2cm"></kendo-grid-pdf-margin>
  <ng-template kendoGridPDFTemplate let-pageNum="pageNum" let-totalPages="totalPages">
   <div class="page-template">
      <div class="header">
        <div style="float: center">{{ title }}</div>
      </div>
      <div class="footer">
        Page {{ pageNum }} of {{ totalPages }}
      </div>
    </div>
  </ng-template>
</kendo-grid-pdf>
<kendo-grid-excel fileName="ExcelfileName" ></kendo-grid-excel>


</kendo-grid>

</kendo-pdf-export>
