<kendo-pdf-export #pdf paperSize="A4" margin="2cm">

  <kendo-grid [rowClass]="ROW_CLASS"
  
  id="grid" [sortable]="true" [height]="componentConfig.gridHeight"
  [resizable] ="true"
  (cellClick)="cellClickHandler($event)" 
  (add)="addHandler()"
  (remove)="removeHandler($event)"
  [filter]="state.filter"
  [filterable]= "isFilterable"
  [columnMenu]="isColumnMenu"
  (dataStateChange)="dataStateChange($event)"
  [resizable]="true"
  [sortable]="true">

  
  
    
      <ng-template kendoGridToolbarTemplate>
      <legend class="k-form-legend" *ngIf="componentConfig.showTitle">{{ title }}</legend>


      
      
      <button kendoButton [icon]="'save'" title="{{starServices.getNLS([],'SAVE','Save')}}" (click)="saveChanges(grid);" *ngIf="!isChild && !isSearch"></button >
      <button  kendoButton [icon]="'print'" title="print" (click)="printScreen()" ></button >

      
          <button  kendoButton  title="Enter Query" (click)="enterQuery(grid);">{{starServices.getNLS([],'ENTER_QUERY','Enter Query')}}</button >
          <button  kendoButton [icon]="'zoom'" title="{{starServices.getNLS([],'EXECUTE_QUERY','Execute Query')}}"  (click)="executeQuery(grid);"></button >
          <button  kendoButton [icon]="'cancel'" title="{{starServices.getNLS([],'CANCEL','Cancel')}}"  (click)="cancelHandler()" ></button >
      

          <button  [icon]="'plus'" title="{{starServices.getNLS([],'INSERT_RECORD','Insert Record')}}"  kendoGridAddCommand *ngIf="!isSearch"></button >
          <button  [icon]="'trash'" title="{{starServices.getNLS([],'DELETE_RECORD','Delete Record')}}"  kendoButton (click)="removeHandler($event)" *ngIf="!isSearch">Remove</button >
      
        <button  kendoButton [icon]="'menu'" title="{{starServices.getNLS([],'SHOW_HIDE_MENU','Show/Hide Menu')}}"  (click)="toggleColumnMenu()" *ngIf="!isSearch"></button >
            <div *ngIf="isColumnMenu">
				<button  kendoButton [icon]="'filter'" title="{{starServices.getNLS([],'SHOW_HIDE_FILTER_OPTIONS','Show/Hide Filter options')}}"  (click)="toggleFilter()" ></button >

          <button  [icon]="'file-pdf'" title="{{starServices.getNLS([],'EXPORT_TO_PDF','Export to PDF')}}"  kendoGridPDFCommand ></button >
          <button  [icon]="'file-excel'" title="{{starServices.getNLS([],'EXPORT_TO_EXCEL','Export to Excel')}}"  kendoGridExcelCommand ></button >
          </div>

  
  </ng-template>


<kendo-grid-column [headerStyle]="{'white-space': 'pre-wrap'}"  [editable]=" !(disabledColumns.indexOf('FILE_NAME') > -1)  && !primarKeyReadOnlyArr.isFILE_NAMEreadOnly  "

[hidden]="hiddenColumns.indexOf('FILE_NAME') > -1" 		 title="{{starServices.getNLS([],'dsp_batch_DSP_BATCH_FIELDS_GRID.dspbatchFieldsDspBatchDspBatchFieldsGrid.FILE_NAME','File Name')}}"  [width]="120">
   <ng-template kendoGridCellTemplate let-dataItem> {{dataItem.FILE_NAME}}</ng-template>
  <ng-template kendoGridEditTemplate let-dataItem let-formGroup="formGroup">
  <input  (blur)="onBlur_FILE_NAME()"    [formControl]="formGroup.get('FILE_NAME')" [placeholder]="starServices.getNLS([],'dsp_batch_DSP_BATCH_FIELDS_GRID.dspbatchFieldsDspBatchDspBatchFieldsGrid.FILE_NAME_Hint','Please enter File Name')" />
  </ng-template>
  </kendo-grid-column>

<kendo-grid-column [headerStyle]="{'white-space': 'pre-wrap'}"  [editable]=" !(disabledColumns.indexOf('FIELD_NAME') > -1)  && !primarKeyReadOnlyArr.isFIELD_NAMEreadOnly  "

[hidden]="hiddenColumns.indexOf('FIELD_NAME') > -1" 		 title="{{starServices.getNLS([],'dsp_batch_DSP_BATCH_FIELDS_GRID.dspbatchFieldsDspBatchDspBatchFieldsGrid.FIELD_NAME','Field Name')}}"  [width]="120">
   <ng-template kendoGridCellTemplate let-dataItem> {{dataItem.FIELD_NAME}}</ng-template>
  <ng-template kendoGridEditTemplate let-dataItem let-formGroup="formGroup">
  <input  (blur)="onBlur_FIELD_NAME()"    [formControl]="formGroup.get('FIELD_NAME')" [placeholder]="starServices.getNLS([],'dsp_batch_DSP_BATCH_FIELDS_GRID.dspbatchFieldsDspBatchDspBatchFieldsGrid.FIELD_NAME_Hint','Please enter Field Name')" />
  </ng-template>
  </kendo-grid-column>

<kendo-grid-column [headerStyle]="{'white-space': 'pre-wrap'}"  [editable]=" !(disabledColumns.indexOf('FIELD_DATA') > -1)  "

[hidden]="hiddenColumns.indexOf('FIELD_DATA') > -1" 		 title="{{starServices.getNLS([],'dsp_batch_DSP_BATCH_FIELDS_GRID.dspbatchFieldsDspBatchDspBatchFieldsGrid.FIELD_DATA','Field Data')}}"  [width]="120">
   <ng-template kendoGridCellTemplate let-dataItem> {{dataItem.FIELD_DATA}}</ng-template>
  <ng-template kendoGridEditTemplate let-dataItem let-formGroup="formGroup">
  <input  (blur)="onBlur_FIELD_DATA()"    [formControl]="formGroup.get('FIELD_DATA')" [placeholder]="starServices.getNLS([],'dsp_batch_DSP_BATCH_FIELDS_GRID.dspbatchFieldsDspBatchDspBatchFieldsGrid.FIELD_DATA_Hint','Please enter Field Data')" />
  </ng-template>
  </kendo-grid-column>

<kendo-grid-column [headerStyle]="{'white-space': 'pre-wrap'}"  *ngIf=false  [editable]=" !(disabledColumns.indexOf('LOGNAME') > -1)  "

[hidden]="hiddenColumns.indexOf('LOGNAME') > -1" 		 title="{{starServices.getNLS([],'dsp_batch_DSP_BATCH_FIELDS_GRID.dspbatchFieldsDspBatchDspBatchFieldsGrid.LOGNAME','Logname')}}"  [width]="120">
   <ng-template kendoGridCellTemplate let-dataItem> {{dataItem.LOGNAME}}</ng-template>
  <ng-template kendoGridEditTemplate let-dataItem let-formGroup="formGroup">
  <input  (blur)="onBlur_LOGNAME()"    [formControl]="formGroup.get('LOGNAME')" [placeholder]="starServices.getNLS([],'dsp_batch_DSP_BATCH_FIELDS_GRID.dspbatchFieldsDspBatchDspBatchFieldsGrid.LOGNAME_Hint','Please enter Logname')" />
  </ng-template>
  </kendo-grid-column>

<kendo-grid-column [headerStyle]="{'white-space': 'pre-wrap'}" field="LOGDATE"  [width]="40"	filter="date"	 editor="date"  title="{{starServices.getNLS([],'dsp_batch_DSP_BATCH_FIELDS_GRID.dspbatchFieldsDspBatchDspBatchFieldsGrid.LOGDATE','Logdate')}}" *ngIf=false  
[editable]=" !(disabledColumns.indexOf('LOGDATE') > -1)  "

[hidden]="hiddenColumns.indexOf('LOGDATE') > -1" 		[format]="paramConfig.DateFormat">
  <ng-template KendoGridEditTemplate  let-dataItem>
  <kendo-datepicker [format]="this.paramConfig.DateFormat" ngDefaultControl	 #datepicker>
   (valueChange)="valueChangeLOGDATE($event)"   		</kendo-datepicker>
  </ng-template>
  </kendo-grid-column>




  
                     <kendo-grid-pdf [fileName]="PDFfileName" [allPages]="true" paperSize="A4" [repeatHeaders]="true" [landscape]="true">
                      <kendo-grid-pdf-margin top="2cm" left="1cm" right="1cm" bottom="2cm"></kendo-grid-pdf-margin>
                      <ng-template kendoGridPDFTemplate let-pageNum="pageNum" let-totalPages="totalPages">
                       <div class="page-template">
                          <div class="header">
                            <div style="float: center">{{ title }}</div>
                          </div>
                          <div class="footer">
                            Page {{ pageNum }} of {{ totalPages }}
                          </div>
                        </div>
                      </ng-template>
                  </kendo-grid-pdf>
                  <kendo-grid-excel fileName="ExcelfileName" ></kendo-grid-excel>
  
  </kendo-grid>
  
<app-dsp-upload (saveCompletedOutput)="this.starServices.att_img_saveGridCompletedHandler($event,this)"
    [setComponentConfig_Input]="DSP_UPLOADConfig">
  </app-dsp-upload>

  </kendo-pdf-export>

<div [hidden]="!showCodeDetails">
<kendo-dialog 
(close)="showCodeDetails=false;setlookupArrDef();" resizable="true" [minWidth]="800" [width]="700" [height]="500"
  title="Add Code">
  <app-som-tabs-codes-grid 
  [detail_Input]="grid_som_tabs_codes"  
  [setComponentConfig_Input]="SOM_TABS_CODESConfig">
</app-som-tabs-codes-grid>

</kendo-dialog>
</div>
