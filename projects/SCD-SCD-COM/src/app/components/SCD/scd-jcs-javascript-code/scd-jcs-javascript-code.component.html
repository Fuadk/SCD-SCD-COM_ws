<div>
    <legend *ngIf="componentConfig.showToolBar"  class="k-form-legend">{{
      componentConfig.title ? componentConfig.title :
       this.starServices.getNLS([],"SCD_JCS_JAVASCRIPT_CODE.scdjavascriptCodeScdJcsJavascriptCode.component_title","Javascript Code") }}</legend>
<div class="form-toolbar"> </div>

<kendo-toolbar class="form-toolbar" *ngIf="componentConfig.showToolBar">

 
    <kendo-toolbar-button [icon]="'sliders'" [disabled]="isSearch"  text="{{isPhonePortrait ? null : starServices.getNLS([],'ENTER_QUERY','Filter')}}" title="{{starServices.getNLS([],'ENTER_QUERY','Filter')}}" (click)="enterQuery( form);" *ngIf="componentConfig.queryable"></kendo-toolbar-button>
    <kendo-toolbar-button [icon]="'search'"  title="{{starServices.getNLS([],'EXECUTE_QUERY','Execute Query')}}"  (click)="executeQuery( form.value);" *ngIf="componentConfig.queryable"></kendo-toolbar-button>
    <kendo-toolbar-button  [icon]="'cancel'"  title="{{starServices.getNLS([],'CANCEL','Cancel')}}"  (click)="onCancel($event)" *ngIf="componentConfig.queryable"></kendo-toolbar-button >

    <kendo-toolbar-buttongroup selection="single" *ngIf="starServices.dataExits(this) && (componentConfig.queryable || componentConfig.navigable)">
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-double-60-right' : 'arrow-double-60-left'" title="{{starServices.getNLS([],'FIRST_RECORD','First Record')}}" (click)="goRecord( 'first');" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button>
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-60-right' : 'arrow-60-left'"  title="{{starServices.getNLS([],'PREVIOUS_RECORD','Previous Record')}}"  (click)="goRecord(  'prev');" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button>
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-60-left' : 'arrow-60-right'" title="{{starServices.getNLS([],'NEXT_RECORD','Next Record')}}"  (click)="goRecord('next')" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button >
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-double-60-left' : 'arrow-double-60-right'" title="{{starServices.getNLS([],'LAST_RECORD','Last Record')}}" (click)="goRecord('last')" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button>
    </kendo-toolbar-buttongroup>

    <kendo-toolbar-button [icon]="'plus'" title="{{starServices.getNLS([],'INSERT_RECORD','Insert Record')}}" (click)="onNew($event);" *ngIf="componentConfig.insertable && !isSearch"></kendo-toolbar-button>

    <kendo-toolbar-button kendoButton [icon]="'save'" title="{{starServices.getNLS([],'SAVE','Save')}}" (click)="saveChanges( form)" *ngIf="(starServices.dataExits(this)|| isNew) && !isChild && componentConfig.updateable && !isSearch"></kendo-toolbar-button>
    <kendo-toolbar-button [icon]="'trash'" title="{{starServices.getNLS([],'DELETE_RECORD','Delete Record')}}" (click)="onRemove( form);" *ngIf=" starServices.dataExits(this) && componentConfig.removeable && !isSearch">Remove</kendo-toolbar-button>

    <kendo-toolbar-button kendoButton  *ngIf="starServices.helpMsg !=='' "  text="{{starServices.helpMsg}}"    ></kendo-toolbar-button>     
</kendo-toolbar>


<kendo-pdf-export #pdf paperSize="A4" margin="2cm">
 <div class="form-borders" > 
    <form class="form-layout" [ngClass]="isPhonePortrait ? 'k-form k-form-horizontal-star' : 'k-form k-form-horizontal' "
     [formGroup]="form" (click)="ON_CLICK(form.value)">
    <!--fieldset class="form-fieldset"  class="k-form-fieldset" [disabled]="!componentConfig.enabled && !isSearch"-->
    <fieldset class="form-fieldset"  class="k-form-fieldset" >


<div [ngClass]="isPhonePortrait || customerFacing ? 'wrapno1' : 'wrap' ">
	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelJAVASCRIPT_CODE_IDTop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleJAVASCRIPT_CODE_ID >
		<kendo-label *ngIf="(!labelJAVASCRIPT_CODE_IDTop && !isPhonePortrait) && labelJAVASCRIPT_CODE_IDVisible" class="form-label" [for]="JAVASCRIPT_CODE_ID" [text]="starServices.getNLS([],'SCD_JCS_JAVASCRIPT_CODE.scdjavascriptCodeScdJcsJavascriptCode.JAVASCRIPT_CODE_ID','Javascript Code Id') + ' *'"></kendo-label>
		<label *ngIf="(labelJAVASCRIPT_CODE_IDTop || isPhonePortrait) && labelJAVASCRIPT_CODE_IDVisible" class="form-label"  >{{starServices.getNLS([],'SCD_JCS_JAVASCRIPT_CODE.scdjavascriptCodeScdJcsJavascriptCode.JAVASCRIPT_CODE_ID','Javascript Code Id') + ' *'}}</label>
		<input   formControlName="JAVASCRIPT_CODE_ID"
 kendoTextBox #JAVASCRIPT_CODE_ID 
		[readonly]="primarKeyReadOnlyArr.isJAVASCRIPT_CODE_IDreadOnly" [placeholder]="starServices.getNLS([],'SCD_JCS_JAVASCRIPT_CODE.scdjavascriptCodeScdJcsJavascriptCode.JAVASCRIPT_CODE_ID_Hint','Please enter Javascript Code Id.')"
		(click)="ON_CLICK_JAVASCRIPT_CODE_ID($event)"
[ngClass]="customerFacing ?  'summaryClass' : 'form-input' " (change)="onChange_JAVASCRIPT_CODE_ID($event)"      adaptiveMode="auto"  />
	</kendo-formfield>

	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelDISPLAY_IDTop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleDISPLAY_ID >
		<kendo-label *ngIf="(!labelDISPLAY_IDTop && !isPhonePortrait) && labelDISPLAY_IDVisible" class="form-label" [for]="DISPLAY_ID" [text]="starServices.getNLS([],'SCD_JCS_JAVASCRIPT_CODE.scdjavascriptCodeScdJcsJavascriptCode.DISPLAY_ID','Display Id') + ' *'"></kendo-label>
		<label *ngIf="(labelDISPLAY_IDTop || isPhonePortrait) && labelDISPLAY_IDVisible" class="form-label"  >{{starServices.getNLS([],'SCD_JCS_JAVASCRIPT_CODE.scdjavascriptCodeScdJcsJavascriptCode.DISPLAY_ID','Display Id') + ' *'}}</label>
		<kendo-combobox  #DISPLAY_ID class="form-field-combobox"  [formControlName]="'DISPLAY_ID'"
		[data]="lkpArrDISPLAY_ID" [textField]="'CODETEXT_LANG'"  [valueField]="'CODE'"

		[ngClass]="{ 'ng-invalid-required  ng-touched': submitted && f.DISPLAY_ID.errors }"  required 
		[readonly]="primarKeyReadOnlyArr.isDISPLAY_IDreadOnly" [placeholder]="starServices.getNLS([],'SCD_JCS_JAVASCRIPT_CODE.scdjavascriptCodeScdJcsJavascriptCode.DISPLAY_ID_Hint','Please enter Display Id.')"		(click)="ON_CLICK_DISPLAY_ID($event)"
 (valueChange)="onValueChange_DISPLAY_ID($event)"      adaptiveMode="auto" 
		 (filterChange)="starServices.handleFilterCode(this, $event)" 
		[valuePrimitive]="true"  [kendoDropDownFilter]="{ operator: 'contains' }">
		 <ng-template kendoDropDownListNoDataTemplate>
		 <div> 
		 	<button *ngIf="filterCode" kendoButton (click)="starServices.addNewCode(this, 'DISPLAY_ID')"> 
		 		{{starServices.getNLS([],'ADD_NEW_ITEM','Add new item')}} 
		 	</button> 
		 </div> 
		 </ng-template> 
		</kendo-combobox>
	</kendo-formfield>


</div>
<div [ngClass]="isPhonePortrait || customerFacing ? 'wrapno1' : 'wrap' ">
	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelSUBROUTINE_NAMETop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleSUBROUTINE_NAME >
		<kendo-label *ngIf="(!labelSUBROUTINE_NAMETop && !isPhonePortrait) && labelSUBROUTINE_NAMEVisible" class="form-label" [for]="SUBROUTINE_NAME" [text]="starServices.getNLS([],'SCD_JCS_JAVASCRIPT_CODE.scdjavascriptCodeScdJcsJavascriptCode.SUBROUTINE_NAME','Subroutine Name')"></kendo-label>
		<label *ngIf="(labelSUBROUTINE_NAMETop || isPhonePortrait) && labelSUBROUTINE_NAMEVisible" class="form-label"  >{{starServices.getNLS([],'SCD_JCS_JAVASCRIPT_CODE.scdjavascriptCodeScdJcsJavascriptCode.SUBROUTINE_NAME','Subroutine Name')}}</label>
		<kendo-combobox  #SUBROUTINE_NAME class="form-field-combobox"  [formControlName]="'SUBROUTINE_NAME'"
		[data]="lkpArrSUBROUTINE_NAME" [textField]="'CODETEXT_LANG'"  [valueField]="'CODE'"
  [placeholder]="starServices.getNLS([],'SCD_JCS_JAVASCRIPT_CODE.scdjavascriptCodeScdJcsJavascriptCode.SUBROUTINE_NAME_Hint','Please enter Subroutine Name.')"		(click)="ON_CLICK_SUBROUTINE_NAME($event)"
 (valueChange)="onValueChange_SUBROUTINE_NAME($event)"      adaptiveMode="auto" 
		 (filterChange)="starServices.handleFilterCode(this, $event)" 
		[valuePrimitive]="true"  [kendoDropDownFilter]="{ operator: 'contains' }">
		 <ng-template kendoDropDownListNoDataTemplate>
		 <div> 
		 	<button *ngIf="filterCode" kendoButton (click)="starServices.addNewCode(this, 'SUBROUTINE_NAME')"> 
		 		{{starServices.getNLS([],'ADD_NEW_ITEM','Add new item')}} 
		 	</button> 
		 </div> 
		 </ng-template> 
		</kendo-combobox>
	</kendo-formfield>

	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelSUBROUTINE_CODETop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleSUBROUTINE_CODE >
		<kendo-label *ngIf="(!labelSUBROUTINE_CODETop && !isPhonePortrait) && labelSUBROUTINE_CODEVisible" class="form-label" [for]="SUBROUTINE_CODE" [text]="starServices.getNLS([],'SCD_JCS_JAVASCRIPT_CODE.scdjavascriptCodeScdJcsJavascriptCode.SUBROUTINE_CODE','Subroutine Code')"></kendo-label>
		<label *ngIf="(labelSUBROUTINE_CODETop || isPhonePortrait) && labelSUBROUTINE_CODEVisible" class="form-label"  >{{starServices.getNLS([],'SCD_JCS_JAVASCRIPT_CODE.scdjavascriptCodeScdJcsJavascriptCode.SUBROUTINE_CODE','Subroutine Code')}}</label>
<app-code-editor  formControlName="SUBROUTINE_CODE" 
		#SUBROUTINE_CODE
		modelId="SUBROUTINE_CODE" 
		language="javascript" theme="vs-dark" 
		width="100px" height="100px" >
 </app-code-editor> 
	</kendo-formfield>
</div>

    </fieldset>
    </form>
    </div>
    <app-dsp-upload (saveCompletedOutput)="this.starServices.att_img_saveFormCompletedHandler($event,this)"
			[setComponentConfig_Input]="DSP_UPLOADConfig">
		</app-dsp-upload>

      <app-dsp-webcam (saveCompletedOutput)="this.starServices.att_img_saveFormCompletedHandler($event,this)"
			[setComponentConfig_Input]="DSP_WEBCAMConfig">
		</app-dsp-webcam>

</kendo-pdf-export>
</div>

<div [hidden]="!showCodeDetails">
	<kendo-dialog 
	(close)="showCodeDetails=false;setlookupArrDef();" resizable="true" [minWidth]="800" [width]="700" [height]="500"
	  title="Add Code">
	  <app-som-tabs-codes-grid 
	  [detail_Input]="grid_som_tabs_codes"  
	  [setComponentConfig_Input]="SOM_TABS_CODESConfig">
	</app-som-tabs-codes-grid>
  
	</kendo-dialog>
  </div>
