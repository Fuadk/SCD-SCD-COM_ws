
	
	
	
	<style>
  .outside-container-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
  }
  
  .outside-container-overlay app-mdi-window {
    pointer-events: auto;
  }
  
  .outside-container-overlay app-mdi-window .mdi-window-maximized {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    border-radius: 0 !important;
    z-index: 9999 !important;
  }
	.mode-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 10px;
    height: 28px;
    border: 2px solid;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-weight: 600;
    flex-shrink: 0;
    
    /* Run mode (isEditMode = true) */
    &.active {
      background: #e94560;
      border-color: #e94560;
      color: #ffffff;
      
      &:hover {
        background: #d63851;
        border-color: #d63851;
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(233, 69, 96, 0.3);
      }
    }
    
    /* Stop mode (isEditMode = false) */
    &.inactive {
      background: #2b8a3e;
      border-color: #2b8a3e;
      color: #ffffff;
      
      &:hover {
        background: #237a34;
        border-color: #237a34;
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(43, 138, 62, 0.3);
      }
    }
    
    .mode-icon {
      font-size: 14px;
      line-height: 1;
    }
    
    .mode-text {
      font-size: 12px;
      line-height: 1;
      letter-spacing: 0.5px;
    }
  }
</style>

<!-- scd-appboard.component.html -->
<div 
style="height: 100vh;  display: flex;  flex-direction: column;" class="form-borders">
  <legend class="k-form-legend screen-legend" *ngIf="componentConfig.showToolBar">
    {{ this.starServices.getNLS([],"scd_appboard.scd_appboard.component_title","SCADA Application") }}
  </legend>

  <!-- Action Bar -->
  <div class="action-bar" *nfIf="false">
    <button kendoButton [icon]="'hyperlink-open'" (click)="openWin('1', null, false)">
      {{ this.starServices.getNLS([],"scd_appboard.scd_appboard.compsTitleID2","Diagram") }}
    </button>
    <button kendoButton [icon]="'hyperlink-open'" (click)="openWin('2', null, false)">
      {{ this.starServices.getNLS([],"scd_appboard.scd_appboard.compsTitleID3","Diagram1") }}
    </button>
    <button kendoButton [icon]="'hyperlink-open'" (click)="openWin('3', null, true)">
      {{ this.starServices.getNLS([],"scd_appboard.scd_appboard.compsTitleID4","Diagram 2") }}
    </button>
    
    <!-- Group Controls -->
    <button kendoButton [icon]="'plus'" themeColor="primary" (click)="createTabGroup('Group ' + (tabGroups.length + 1))">
      New Group
    </button>
    </div>
	<div class="wrap">
      
		<button *ngIf="getTotalWindowCount()" class="mode-btn" [class.active]="isEditMode" [class.inactive]="!isEditMode" kendoTooltip
		[title]="isEditMode ? 'Stop Editing' : 'Start Editing'" (click)="toggleMode()">
		<span class="mode-icon">{{ isEditMode ? '▶' : '⏹' }}</span>

		</button>
		<!-- ===== KENDO DROPDOWN BUTTON ===== -->
		<kendo-dropdownbutton 
			[icon]="'window'"
			[data]="menuItems"
			(itemClick)="onMenuItemClick($event)"
			themeColor="secondary"
			class="window-menu-btn">
			{{ getTotalWindowCount() }} windows
		 </kendo-dropdownbutton>
	</div>
  

  <!-- Tab Host -->
  <div class="tab-host" [class.tab-host-dark]="isDarkTheme" style="flex: 1; display: flex; position: relative;">
    
    <!-- ===== GROUP TABS (TOP LEVEL) ===== -->
    <div class="group-tabs-container" *ngIf="tabGroups.length > 0" style="flex: 1;flex-direction: column;">
      <kendo-tabstrip style="height: 100% !important;"
        [keepTabContent]="true"
        [tabPosition]="'top'"
        [tabAlignment]="'start'"
        (tabSelect)="onGroupTabSelect($event)"
        class="group-tabstrip"
      >
        <kendo-tabstrip-tab 
          *ngFor="let group of tabGroups; trackBy: trackGroup"
          [title]="group.title"
          [selected]="group.id === activeGroupId"
          [closable]="false"
          [disabled]="false"
        >
          <ng-template kendoTabTitle>
            <span class="group-tab-title">{{ group.title }}</span>
            <span 
              class="close-group-btn"
              (click)="closeGroup(group.id, $event)"
              (mousedown)="$event.stopPropagation()"
              title="Close Group"
            >
              ×
            </span>
          </ng-template>
          
          <ng-template kendoTabContent>
            <!-- ===== FLOATING WINDOWS FOR SELECTED GROUP ===== -->
            <div class="group-content-area" style="position: relative; width: 100%; height: 100%;">
              <!-- Show floating windows that belong to this group (excluding outside-container windows) -->
              <div *ngIf="getWindowsForGroup(group.id).length > 0" class="floating-windows-container">
                <!-- FIX: Use ng-container to separate ngFor and ngIf -->
               <ng-container *ngFor="let window of getWindowsForGroup(group.id)">
                <app-mdi-window
                  *ngIf="!window.outsideContainer"
                  [window]="window"
                  (closeWindow)="onCloseWindow($event)"
                  (bringToFrontWindow)="bringToFront($event)"
                  (activateWindow)="activateGroupWindow(group.id, $event)"
                  (minimizeWindow)="minimizeWindow($event)"
                  (maximizeWindow)="maximizeWindow($event)"
                  (dragWindow)="onDragStart($event)"
                  (resizeWindow)="onResizeStart($event)"
                  (componentConfigChanged)="onComponentConfig_Output($event)">
                </app-mdi-window>
              </ng-container>

              </div>
              
              <!-- Empty state for group with no windows -->
              <div *ngIf="getWindowsForGroup(group.id).length === 0" 
              class="empty-group-content" style="flex: 1;  display: flex;  flex-direction: column;  align-items: center;  justify-content: center;">
                <span class="empty-icon-small" style="font-size: 32px; margin-bottom: 8px;">📂</span>
                <p>No windows in this group</p>
                <button kendoButton size="small" (click)="addWindowToGroup(group.id)">
                  Add Window
                </button>
              </div>
            </div>
          </ng-template>
        </kendo-tabstrip-tab>
      </kendo-tabstrip>
    </div>

    <!-- ===== FLOATING WINDOWS (NO GROUPS - FALLBACK) =====  -->
    <div class="floating-windows-container full-height" >
      <!-- FIX: Use ng-container to separate ngFor and ngIf Fuad : check original below -->
      <ng-container *ngFor="let window of windows">
        <app-mdi-window
          *ngIf="!window.outsideContainer"
          [window]="window"
          (closeWindow)="onCloseWindow($event)"
          (bringToFrontWindow)="bringToFront($event)"
          (activateWindow)="activateFloatingWindow($event)"
          (minimizeWindow)="minimizeWindow($event)"
          (maximizeWindow)="maximizeWindow($event)"
          (dragWindow)="onDragStart($event)"
          (resizeWindow)="onResizeStart($event)"
          (componentConfigChanged)="onComponentConfig_Output($event)">
        </app-mdi-window>
      </ng-container>
    </div>

	<!-- Fuad Original where no 2 windows are shown inside a group-->
	<!--div class="floating-windows-container full-height" style="position: relative;" *ngIf="tabGroups.length === 0 && windows.length > 0">
      <app-mdi-window
        *ngFor="let window of windows"
        [window]="window"
        (closeWindow)="closeWindow($event)"
        (bringToFrontWindow)="bringToFront($event)"
        (activateWindow)="activateFloatingWindow($event)"
        (minimizeWindow)="minimizeWindow($event)"
        (maximizeWindow)="maximizeWindow($event)"
        (dragWindow)="onDragStart($event)"
        (resizeWindow)="onResizeStart($event)">
      </app-mdi-window>
    </div-->


    <!-- Empty State -->
    <div class="empty-state" *ngIf="getTotalWindowCount() === 0 && tabGroups.length === 0">
      <div class="empty-state-content">
        <span class="empty-icon">📂</span>
        <h3>No Windows Open</h3>
      </div>
    </div>
  </div>

  <!-- ===== NEW: OUTSIDE CONTAINER OVERLAY ===== -->
  <!-- This renders windows outside the main container (e.g., Symbol Factory) -->
  <div class="outside-container-overlay">
    <!-- FIX: Use ng-container to separate ngFor and ngIf -->
    <ng-container *ngFor="let window of windows">
  <app-mdi-window
    *ngIf="window.outsideContainer"
    [window]="window"
    (closeWindow)="onCloseWindow($event)"
    (bringToFrontWindow)="bringToFront($event)"
    (activateWindow)="activateFloatingWindow($event)"
    (minimizeWindow)="minimizeWindow($event)"
    (maximizeWindow)="maximizeWindow($event)"
    (dragWindow)="onDragStart($event)"
    (resizeWindow)="onResizeStart($event)"
    (componentConfigChanged)="onComponentConfig_Output($event)">
  </app-mdi-window>
</ng-container>
  </div>
</div>
