    <div>   
        <legend class="k-form-legend" class="screen-legend">{{ this.starServices.getNLS([],"scd_actionbuttons.scd_actionbuttons.component_title","") }}</legend> 
    <div [ngClass]="isPhonePortrait || customerFacing ? 'wrapno1' : 'wrapScreen' ">   
 <button [icon]="isPhonePortrait ? null : 'hyperlink-open'" title="grid_1" style="margin-right : 10px ;" kendoButton (click)="grid_1_SCD_COMMANDSOpen()" > {{this.starServices.getNLS([],"scd_actionbuttons.scd_actionbuttons.compsTitleID2","Commands")}}</button >
    </div>   

        <app-scd-ba-button-action  
                      (readCompletedOutput)="readCompletedHandler($event)"
                      (clearCompletedOutput)="clearCompletedHandler($event)"
                      (saveCompletedOutput)="saveCompletedHandler($event)"
                      (formValidationChangedOutput)="formValidationChangedMD($event, 1)"
                      (setComponentConfig_Output)="onComponentConfig_Output($event)"
                      [setComponentConfig_Input]="SCD_BUTTON_ACTIONFormdivs_0Config">
        </app-scd-ba-button-action >


        <kendo-window [hidden]="!grid_1_SCD_COMMANDSOpened" class="form-borders" 
 			[themeColor]="'primary'"
			[top]="0" [left]="0"  title=""   (close)="grid_1_SCD_COMMANDSClose()" > 
        <app-scd-scd-commands-grid  [detail_Input]="grid_1_SCD_COMMANDS"  
                      (formValidationChangedOutput)="formValidationChangedMD($event,2)"
                      (saveCompletedOutput)="saveCompletedHandler2($event)"
						(cancelClicked)="grid_1_SCD_COMMANDSClose()" 
                      (setComponentConfig_Output)="onComponentConfig_Output($event)"
                      [setComponentConfig_Input]="SCD_COMMANDSGrid_1Config">
        </app-scd-scd-commands-grid >


			<button kendoButton [icon]="'close'" (click)="grid_1_SCD_COMMANDSOpened=!grid_1_SCD_COMMANDSOpened"> {{this.starServices.getNLS([],"CLOSE","Close")}}</button>
</kendo-window>
    </div>
