<div>
    <legend *ngIf="componentConfig.showToolBar"  class="k-form-legend">{{
      componentConfig.title ? componentConfig.title :
       this.starServices.getNLS([],"SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.component_title","Communication Setup Details") }}</legend>
<div class="form-toolbar"> </div>

<kendo-toolbar class="form-toolbar" *ngIf="componentConfig.showToolBar">

 
    <kendo-toolbar-button [icon]="'sliders'" [disabled]="isSearch"  text="{{isPhonePortrait ? null : starServices.getNLS([],'ENTER_QUERY','Filter')}}" title="{{starServices.getNLS([],'ENTER_QUERY','Filter')}}" (click)="enterQuery( form);" *ngIf="componentConfig.queryable"></kendo-toolbar-button>
    <kendo-toolbar-button [icon]="'search'"  title="{{starServices.getNLS([],'EXECUTE_QUERY','Execute Query')}}"  (click)="executeQuery( form.value);" *ngIf="componentConfig.queryable"></kendo-toolbar-button>
    <kendo-toolbar-button  [icon]="'cancel'"  title="{{starServices.getNLS([],'CANCEL','Cancel')}}"  (click)="onCancel($event)" *ngIf="componentConfig.queryable"></kendo-toolbar-button >

    <kendo-toolbar-buttongroup selection="single" *ngIf="starServices.dataExits(this) && (componentConfig.queryable || componentConfig.navigable)">
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-double-60-right' : 'arrow-double-60-left'" title="{{starServices.getNLS([],'FIRST_RECORD','First Record')}}" (click)="goRecord( 'first');" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button>
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-60-right' : 'arrow-60-left'"  title="{{starServices.getNLS([],'PREVIOUS_RECORD','Previous Record')}}"  (click)="goRecord(  'prev');" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button>
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-60-left' : 'arrow-60-right'" title="{{starServices.getNLS([],'NEXT_RECORD','Next Record')}}"  (click)="goRecord('next')" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button >
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-double-60-left' : 'arrow-double-60-right'" title="{{starServices.getNLS([],'LAST_RECORD','Last Record')}}" (click)="goRecord('last')" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button>
    </kendo-toolbar-buttongroup>

    <kendo-toolbar-button [icon]="'plus'" title="{{starServices.getNLS([],'INSERT_RECORD','Insert Record')}}" (click)="onNew($event);" *ngIf="componentConfig.insertable && !isSearch"></kendo-toolbar-button>

    <kendo-toolbar-button kendoButton [icon]="'save'" title="{{starServices.getNLS([],'SAVE','Save')}}" (click)="saveChanges( form)" *ngIf="(starServices.dataExits(this)|| isNew) && !isChild && componentConfig.updateable && !isSearch"></kendo-toolbar-button>
    <kendo-toolbar-button [icon]="'trash'" title="{{starServices.getNLS([],'DELETE_RECORD','Delete Record')}}" (click)="onRemove( form);" *ngIf=" starServices.dataExits(this) && componentConfig.removeable && !isSearch">Remove</kendo-toolbar-button>

    <kendo-toolbar-button kendoButton  *ngIf="starServices.helpMsg !=='' "  text="{{starServices.helpMsg}}"    ></kendo-toolbar-button>     
</kendo-toolbar>


<kendo-pdf-export #pdf paperSize="A4" margin="2cm">
 <div class="form-borders" > 
    <form class="form-layout" [ngClass]="isPhonePortrait ? 'k-form k-form-horizontal-star' : 'k-form k-form-horizontal' "
     [formGroup]="form" (click)="ON_CLICK(form.value)">
    <!--fieldset class="form-fieldset"  class="k-form-fieldset" [disabled]="!componentConfig.enabled && !isSearch"-->
    <fieldset class="form-fieldset"  class="k-form-fieldset" >


<div [ngClass]="isPhonePortrait || customerFacing ? 'wrapno1' : 'wrap' ">
	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelCOMMUNICATION_SETUP_IDTop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleCOMMUNICATION_SETUP_ID >
		<kendo-label *ngIf="(!labelCOMMUNICATION_SETUP_IDTop && !isPhonePortrait) && labelCOMMUNICATION_SETUP_IDVisible" class="form-label" [for]="COMMUNICATION_SETUP_ID" [text]="starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.COMMUNICATION_SETUP_ID','Communication Setup Id') + ' *'"></kendo-label>
		<label *ngIf="(labelCOMMUNICATION_SETUP_IDTop || isPhonePortrait) && labelCOMMUNICATION_SETUP_IDVisible" class="form-label"  >{{starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.COMMUNICATION_SETUP_ID','Communication Setup Id') + ' *'}}</label>
		<input   formControlName="COMMUNICATION_SETUP_ID"
 kendoTextBox #COMMUNICATION_SETUP_ID 
		[readonly]="primarKeyReadOnlyArr.isCOMMUNICATION_SETUP_IDreadOnly" [placeholder]="starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.COMMUNICATION_SETUP_ID_Hint','Please enter Communication Setup Id.')"
		(click)="ON_CLICK_COMMUNICATION_SETUP_ID($event)"
[ngClass]="customerFacing ?  'summaryClass' : 'form-input' " (change)="onChange_COMMUNICATION_SETUP_ID($event)"      adaptiveMode="auto"  />
	</kendo-formfield>

	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelAPPLICATION_IDTop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleAPPLICATION_ID >
		<kendo-label *ngIf="(!labelAPPLICATION_IDTop && !isPhonePortrait) && labelAPPLICATION_IDVisible" class="form-label" [for]="APPLICATION_ID" [text]="starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.APPLICATION_ID','Application Id') + ' *'"></kendo-label>
		<label *ngIf="(labelAPPLICATION_IDTop || isPhonePortrait) && labelAPPLICATION_IDVisible" class="form-label"  >{{starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.APPLICATION_ID','Application Id') + ' *'}}</label>
		<kendo-combobox  #APPLICATION_ID class="form-field-combobox"  [formControlName]="'APPLICATION_ID'"
		[data]="lkpArrAPPLICATION_ID" [textField]="'CODETEXT_LANG'"  [valueField]="'CODE'"

		[ngClass]="{ 'ng-invalid-required  ng-touched': submitted && f.APPLICATION_ID.errors }"  required 
		[readonly]="primarKeyReadOnlyArr.isAPPLICATION_IDreadOnly" [placeholder]="starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.APPLICATION_ID_Hint','Please enter Application Id.')"		(click)="ON_CLICK_APPLICATION_ID($event)"
 (valueChange)="onValueChange_APPLICATION_ID($event)"      adaptiveMode="auto" 
		 (filterChange)="starServices.handleFilterCode(this, $event)" 
		[valuePrimitive]="true"  [kendoDropDownFilter]="{ operator: 'contains' }">
		 <ng-template kendoDropDownListNoDataTemplate>
		 <div> 
		 	<button *ngIf="filterCode" kendoButton (click)="starServices.addNewCode(this, 'APPLICATION_ID')"> 
		 		{{starServices.getNLS([],'ADD_NEW_ITEM','Add new item')}} 
		 	</button> 
		 </div> 
		 </ng-template> 
		</kendo-combobox>
	</kendo-formfield>


</div>
<div [ngClass]="isPhonePortrait || customerFacing ? 'wrapno1' : 'wrap' ">
	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelSERVER_IDTop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleSERVER_ID >
		<kendo-label *ngIf="(!labelSERVER_IDTop && !isPhonePortrait) && labelSERVER_IDVisible" class="form-label" [for]="SERVER_ID" [text]="starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.SERVER_ID','Server Id') + ' *'"></kendo-label>
		<label *ngIf="(labelSERVER_IDTop || isPhonePortrait) && labelSERVER_IDVisible" class="form-label"  >{{starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.SERVER_ID','Server Id') + ' *'}}</label>
		<kendo-combobox  #SERVER_ID class="form-field-combobox"  [formControlName]="'SERVER_ID'"
		[data]="lkpArrSERVER_ID" [textField]="'CODETEXT_LANG'"  [valueField]="'CODE'"

		[ngClass]="{ 'ng-invalid-required  ng-touched': submitted && f.SERVER_ID.errors }"  required 
		[readonly]="primarKeyReadOnlyArr.isSERVER_IDreadOnly" [placeholder]="starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.SERVER_ID_Hint','Please enter Server Id.')"		(click)="ON_CLICK_SERVER_ID($event)"
 (valueChange)="onValueChange_SERVER_ID($event)"      adaptiveMode="auto" 
		 (filterChange)="starServices.handleFilterCode(this, $event)" 
		[valuePrimitive]="true"  [kendoDropDownFilter]="{ operator: 'contains' }">
		 <ng-template kendoDropDownListNoDataTemplate>
		 <div> 
		 	<button *ngIf="filterCode" kendoButton (click)="starServices.addNewCode(this, 'SERVER_ID')"> 
		 		{{starServices.getNLS([],'ADD_NEW_ITEM','Add new item')}} 
		 	</button> 
		 </div> 
		 </ng-template> 
		</kendo-combobox>
	</kendo-formfield>

	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelSERVER_NAMETop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleSERVER_NAME >
		<kendo-label *ngIf="(!labelSERVER_NAMETop && !isPhonePortrait) && labelSERVER_NAMEVisible" class="form-label" [for]="SERVER_NAME" [text]="starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.SERVER_NAME','Server Name')"></kendo-label>
		<label *ngIf="(labelSERVER_NAMETop || isPhonePortrait) && labelSERVER_NAMEVisible" class="form-label"  >{{starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.SERVER_NAME','Server Name')}}</label>
		<input   formControlName="SERVER_NAME"
 kendoTextBox #SERVER_NAME  [placeholder]="starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.SERVER_NAME_Hint','Please enter Server Name.')"
		(click)="ON_CLICK_SERVER_NAME($event)"
[ngClass]="customerFacing ?  'summaryClass' : 'form-input' " (change)="onChange_SERVER_NAME($event)"      adaptiveMode="auto"  />
	</kendo-formfield>


</div>
<div [ngClass]="isPhonePortrait || customerFacing ? 'wrapno1' : 'wrap' ">
	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelUPLOAD_ALL_EXTENDED_TAG_PROPERTIESTop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleUPLOAD_ALL_EXTENDED_TAG_PROPERTIES >
		<kendo-label *ngIf="(!labelUPLOAD_ALL_EXTENDED_TAG_PROPERTIESTop && !isPhonePortrait) && labelUPLOAD_ALL_EXTENDED_TAG_PROPERTIESVisible" class="form-label" [for]="UPLOAD_ALL_EXTENDED_TAG_PROPERTIES" [text]="starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.UPLOAD_ALL_EXTENDED_TAG_PROPERTIES','Upload All Extended Tag Properties')"></kendo-label>
		<label *ngIf="(labelUPLOAD_ALL_EXTENDED_TAG_PROPERTIESTop || isPhonePortrait) && labelUPLOAD_ALL_EXTENDED_TAG_PROPERTIESVisible" class="form-label"  >{{starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.UPLOAD_ALL_EXTENDED_TAG_PROPERTIES','Upload All Extended Tag Properties')}}</label>
		<input [ngClass]="customerFacing ?  'summaryClass' : 'form-input' "  formControlName="UPLOAD_ALL_EXTENDED_TAG_PROPERTIES"
  #UPLOAD_ALL_EXTENDED_TAG_PROPERTIES kendoCheckBox type="checkbox"   [placeholder]="starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.UPLOAD_ALL_EXTENDED_TAG_PROPERTIES_Hint','Please enter Upload All Extended Tag Properties.')"		(click)="ON_CLICK_UPLOAD_ALL_EXTENDED_TAG_PROPERTIES($event)"
 (change)="onChange_UPLOAD_ALL_EXTENDED_TAG_PROPERTIES($event)"      adaptiveMode="auto" 
 />
	</kendo-formfield>

	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelPROVIDE_PASS_THROUGH_DESCRIPTION_FOR_TAGSTop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visiblePROVIDE_PASS_THROUGH_DESCRIPTION_FOR_TAGS >
		<kendo-label *ngIf="(!labelPROVIDE_PASS_THROUGH_DESCRIPTION_FOR_TAGSTop && !isPhonePortrait) && labelPROVIDE_PASS_THROUGH_DESCRIPTION_FOR_TAGSVisible" class="form-label" [for]="PROVIDE_PASS_THROUGH_DESCRIPTION_FOR_TAGS" [text]="starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.PROVIDE_PASS_THROUGH_DESCRIPTION_FOR_TAGS','Provide Pass Through Description For Tags')"></kendo-label>
		<label *ngIf="(labelPROVIDE_PASS_THROUGH_DESCRIPTION_FOR_TAGSTop || isPhonePortrait) && labelPROVIDE_PASS_THROUGH_DESCRIPTION_FOR_TAGSVisible" class="form-label"  >{{starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.PROVIDE_PASS_THROUGH_DESCRIPTION_FOR_TAGS','Provide Pass Through Description For Tags')}}</label>
		<input [ngClass]="customerFacing ?  'summaryClass' : 'form-input' "  formControlName="PROVIDE_PASS_THROUGH_DESCRIPTION_FOR_TAGS"
  #PROVIDE_PASS_THROUGH_DESCRIPTION_FOR_TAGS kendoCheckBox type="checkbox"   [placeholder]="starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.PROVIDE_PASS_THROUGH_DESCRIPTION_FOR_TAGS_Hint','Please enter Provide Pass Through Description For Tags.')"		(click)="ON_CLICK_PROVIDE_PASS_THROUGH_DESCRIPTION_FOR_TAGS($event)"
 (change)="onChange_PROVIDE_PASS_THROUGH_DESCRIPTION_FOR_TAGS($event)"      adaptiveMode="auto" 
 />
	</kendo-formfield>


</div>
<div [ngClass]="isPhonePortrait || customerFacing ? 'wrapno1' : 'wrap' ">
	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelSHORTCUT_TYPETop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleSHORTCUT_TYPE >
		<kendo-label *ngIf="(!labelSHORTCUT_TYPETop && !isPhonePortrait) && labelSHORTCUT_TYPEVisible" class="form-label" [for]="SHORTCUT_TYPE" [text]="starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.SHORTCUT_TYPE','Shortcut Type')"></kendo-label>
		<label *ngIf="(labelSHORTCUT_TYPETop || isPhonePortrait) && labelSHORTCUT_TYPEVisible" class="form-label"  >{{starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.SHORTCUT_TYPE','Shortcut Type')}}</label>
		<kendo-combobox  #SHORTCUT_TYPE class="form-field-combobox"  [formControlName]="'SHORTCUT_TYPE'"
		[data]="lkpArrSHORTCUT_TYPE" [textField]="'CODETEXT_LANG'"  [valueField]="'CODE'"
  [placeholder]="starServices.getNLS([],'SCD_ACS_COMMUNICATION_SETUP_DETAILS.scdcommunicationSetupScdAcsCommunicationSetupDetails.SHORTCUT_TYPE_Hint','Please enter Shortcut Type.')"		(click)="ON_CLICK_SHORTCUT_TYPE($event)"
 (valueChange)="onValueChange_SHORTCUT_TYPE($event)"      adaptiveMode="auto" 
		 (filterChange)="starServices.handleFilterCode(this, $event)" 
		[valuePrimitive]="true"  [kendoDropDownFilter]="{ operator: 'contains' }">
		 <ng-template kendoDropDownListNoDataTemplate>
		 <div> 
		 	<button *ngIf="filterCode" kendoButton (click)="starServices.addNewCode(this, 'SHORTCUT_TYPE')"> 
		 		{{starServices.getNLS([],'ADD_NEW_ITEM','Add new item')}} 
		 	</button> 
		 </div> 
		 </ng-template> 
		</kendo-combobox>
	</kendo-formfield>
</div>

    </fieldset>
    </form>
    </div>
    <app-dsp-upload (saveCompletedOutput)="this.starServices.att_img_saveFormCompletedHandler($event,this)"
			[setComponentConfig_Input]="DSP_UPLOADConfig">
		</app-dsp-upload>

      <app-dsp-webcam (saveCompletedOutput)="this.starServices.att_img_saveFormCompletedHandler($event,this)"
			[setComponentConfig_Input]="DSP_WEBCAMConfig">
		</app-dsp-webcam>

</kendo-pdf-export>
</div>

<div [hidden]="!showCodeDetails">
	<kendo-dialog 
	(close)="showCodeDetails=false;setlookupArrDef();" resizable="true" [minWidth]="800" [width]="700" [height]="500"
	  title="Add Code">
	  <app-som-tabs-codes-grid 
	  [detail_Input]="grid_som_tabs_codes"  
	  [setComponentConfig_Input]="SOM_TABS_CODESConfig">
	</app-som-tabs-codes-grid>
  
	</kendo-dialog>
  </div>
