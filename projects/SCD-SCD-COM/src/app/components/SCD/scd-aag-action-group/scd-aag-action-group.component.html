<div>
    <legend *ngIf="componentConfig.showToolBar"  class="k-form-legend">{{
      componentConfig.title ? componentConfig.title :
       this.starServices.getNLS([],"SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.component_title","Action Group") }}</legend>
<div class="form-toolbar"> </div>

<kendo-toolbar class="form-toolbar" *ngIf="componentConfig.showToolBar">

 
    <kendo-toolbar-button [icon]="'sliders'" [disabled]="isSearch"  text="{{isPhonePortrait ? null : starServices.getNLS([],'ENTER_QUERY','Filter')}}" title="{{starServices.getNLS([],'ENTER_QUERY','Filter')}}" (click)="enterQuery( form);" *ngIf="componentConfig.queryable"></kendo-toolbar-button>
    <kendo-toolbar-button [icon]="'search'"  title="{{starServices.getNLS([],'EXECUTE_QUERY','Execute Query')}}"  (click)="executeQuery( form.value);" *ngIf="componentConfig.queryable"></kendo-toolbar-button>
    <kendo-toolbar-button  [icon]="'cancel'"  title="{{starServices.getNLS([],'CANCEL','Cancel')}}"  (click)="onCancel($event)" *ngIf="componentConfig.queryable"></kendo-toolbar-button >

    <kendo-toolbar-buttongroup selection="single" *ngIf="starServices.dataExits(this) && (componentConfig.queryable || componentConfig.navigable)">
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-double-60-right' : 'arrow-double-60-left'" title="{{starServices.getNLS([],'FIRST_RECORD','First Record')}}" (click)="goRecord( 'first');" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button>
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-60-right' : 'arrow-60-left'"  title="{{starServices.getNLS([],'PREVIOUS_RECORD','Previous Record')}}"  (click)="goRecord(  'prev');" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button>
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-60-left' : 'arrow-60-right'" title="{{starServices.getNLS([],'NEXT_RECORD','Next Record')}}"  (click)="goRecord('next')" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button >
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-double-60-left' : 'arrow-double-60-right'" title="{{starServices.getNLS([],'LAST_RECORD','Last Record')}}" (click)="goRecord('last')" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button>
    </kendo-toolbar-buttongroup>

    <kendo-toolbar-button [icon]="'plus'" title="{{starServices.getNLS([],'INSERT_RECORD','Insert Record')}}" (click)="onNew($event);" *ngIf="componentConfig.insertable && !isSearch"></kendo-toolbar-button>

    <kendo-toolbar-button kendoButton [icon]="'save'" title="{{starServices.getNLS([],'SAVE','Save')}}" (click)="saveChanges( form)" *ngIf="(starServices.dataExits(this)|| isNew) && !isChild && componentConfig.updateable && !isSearch"></kendo-toolbar-button>
    <kendo-toolbar-button [icon]="'trash'" title="{{starServices.getNLS([],'DELETE_RECORD','Delete Record')}}" (click)="onRemove( form);" *ngIf=" starServices.dataExits(this) && componentConfig.removeable && !isSearch">Remove</kendo-toolbar-button>

    <kendo-toolbar-button kendoButton  *ngIf="starServices.helpMsg !=='' "  text="{{starServices.helpMsg}}"    ></kendo-toolbar-button>     
</kendo-toolbar>


<kendo-pdf-export #pdf paperSize="A4" margin="2cm">
 <div class="form-borders" > 
    <form class="form-layout" [ngClass]="isPhonePortrait ? 'k-form k-form-horizontal-star' : 'k-form k-form-horizontal' "
     [formGroup]="form" (click)="ON_CLICK(form.value)">
    <!--fieldset class="form-fieldset"  class="k-form-fieldset" [disabled]="!componentConfig.enabled && !isSearch"-->
    <fieldset class="form-fieldset"  class="k-form-fieldset" >


<div [ngClass]="isPhonePortrait || customerFacing ? 'wrapno1' : 'wrap' ">
	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelACTION_GROUP_IDTop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleACTION_GROUP_ID >
		<kendo-label *ngIf="(!labelACTION_GROUP_IDTop && !isPhonePortrait) && labelACTION_GROUP_IDVisible" class="form-label" [for]="ACTION_GROUP_ID" [text]="starServices.getNLS([],'SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.ACTION_GROUP_ID','Action Group Id') + ' *'"></kendo-label>
		<label *ngIf="(labelACTION_GROUP_IDTop || isPhonePortrait) && labelACTION_GROUP_IDVisible" class="form-label"  >{{starServices.getNLS([],'SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.ACTION_GROUP_ID','Action Group Id') + ' *'}}</label>
		<input   formControlName="ACTION_GROUP_ID"
 kendoTextBox #ACTION_GROUP_ID 
		[readonly]="primarKeyReadOnlyArr.isACTION_GROUP_IDreadOnly" [placeholder]="starServices.getNLS([],'SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.ACTION_GROUP_ID_Hint','Please enter Action Group Id.')"
		(click)="ON_CLICK_ACTION_GROUP_ID($event)"
[ngClass]="customerFacing ?  'summaryClass' : 'form-input' " (change)="onChange_ACTION_GROUP_ID($event)"      adaptiveMode="auto"  />
	</kendo-formfield>

	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelAPPLICATION_IDTop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleAPPLICATION_ID >
		<kendo-label *ngIf="(!labelAPPLICATION_IDTop && !isPhonePortrait) && labelAPPLICATION_IDVisible" class="form-label" [for]="APPLICATION_ID" [text]="starServices.getNLS([],'SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.APPLICATION_ID','Application Id') + ' *'"></kendo-label>
		<label *ngIf="(labelAPPLICATION_IDTop || isPhonePortrait) && labelAPPLICATION_IDVisible" class="form-label"  >{{starServices.getNLS([],'SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.APPLICATION_ID','Application Id') + ' *'}}</label>
		<kendo-combobox  #APPLICATION_ID class="form-field-combobox"  [formControlName]="'APPLICATION_ID'"
		[data]="lkpArrAPPLICATION_ID" [textField]="'CODETEXT_LANG'"  [valueField]="'CODE'"

		[ngClass]="{ 'ng-invalid-required  ng-touched': submitted && f.APPLICATION_ID.errors }"  required 
		[readonly]="primarKeyReadOnlyArr.isAPPLICATION_IDreadOnly" [placeholder]="starServices.getNLS([],'SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.APPLICATION_ID_Hint','Please enter Application Id.')"		(click)="ON_CLICK_APPLICATION_ID($event)"
 (valueChange)="onValueChange_APPLICATION_ID($event)"      adaptiveMode="auto" 
		 (filterChange)="starServices.handleFilterCode(this, $event)" 
		[valuePrimitive]="true"  [kendoDropDownFilter]="{ operator: 'contains' }">
		 <ng-template kendoDropDownListNoDataTemplate>
		 <div> 
		 	<button *ngIf="filterCode" kendoButton (click)="starServices.addNewCode(this, 'APPLICATION_ID')"> 
		 		{{starServices.getNLS([],'ADD_NEW_ITEM','Add new item')}} 
		 	</button> 
		 </div> 
		 </ng-template> 
		</kendo-combobox>
	</kendo-formfield>


</div>
<div [ngClass]="isPhonePortrait || customerFacing ? 'wrapno1' : 'wrap' ">
	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelGROUP_IDTop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleGROUP_ID >
		<kendo-label *ngIf="(!labelGROUP_IDTop && !isPhonePortrait) && labelGROUP_IDVisible" class="form-label" [for]="GROUP_ID" [text]="starServices.getNLS([],'SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.GROUP_ID','Group Id')"></kendo-label>
		<label *ngIf="(labelGROUP_IDTop || isPhonePortrait) && labelGROUP_IDVisible" class="form-label"  >{{starServices.getNLS([],'SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.GROUP_ID','Group Id')}}</label>
		<input   formControlName="GROUP_ID"
 kendoTextBox #GROUP_ID  [placeholder]="starServices.getNLS([],'SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.GROUP_ID_Hint','Please enter Group Id.')"
		(click)="ON_CLICK_GROUP_ID($event)"
[ngClass]="customerFacing ?  'summaryClass' : 'form-input' " (change)="onChange_GROUP_ID($event)"      adaptiveMode="auto"  />
	</kendo-formfield>

	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelGROUP_NAMETop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleGROUP_NAME >
		<kendo-label *ngIf="(!labelGROUP_NAMETop && !isPhonePortrait) && labelGROUP_NAMEVisible" class="form-label" [for]="GROUP_NAME" [text]="starServices.getNLS([],'SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.GROUP_NAME','Group Name')"></kendo-label>
		<label *ngIf="(labelGROUP_NAMETop || isPhonePortrait) && labelGROUP_NAMEVisible" class="form-label"  >{{starServices.getNLS([],'SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.GROUP_NAME','Group Name')}}</label>
		<input   formControlName="GROUP_NAME"
 kendoTextBox #GROUP_NAME  [placeholder]="starServices.getNLS([],'SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.GROUP_NAME_Hint','Please enter Group Name.')"
		(click)="ON_CLICK_GROUP_NAME($event)"
[ngClass]="customerFacing ?  'summaryClass' : 'form-input' " (change)="onChange_GROUP_NAME($event)"      adaptiveMode="auto"  />
	</kendo-formfield>


</div>
<div [ngClass]="isPhonePortrait || customerFacing ? 'wrapno1' : 'wrap' ">
	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelACTION_GROUPTop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleACTION_GROUP >
		<kendo-label *ngIf="(!labelACTION_GROUPTop && !isPhonePortrait) && labelACTION_GROUPVisible" class="form-label" [for]="ACTION_GROUP" [text]="starServices.getNLS([],'SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.ACTION_GROUP','Action Group')"></kendo-label>
		<label *ngIf="(labelACTION_GROUPTop || isPhonePortrait) && labelACTION_GROUPVisible" class="form-label"  >{{starServices.getNLS([],'SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.ACTION_GROUP','Action Group')}}</label>
		<kendo-multiselecttree  #ACTION_GROUP class="form-field-combobox"  [formControlName]="'ACTION_GROUP'"
		kendoMultiSelectTreeExpandable 
		childrenField="items"
		[kendoMultiSelectTreeHierarchyBinding]="lkpArrACTION_GROUP" textField="text"  valueField="id"
  [placeholder]="starServices.getNLS([],'SCD_AAG_ACTION_GROUP.scdactionGroupScdAagActionGroup.ACTION_GROUP_Hint','Please enter Action Group.')"		(click)="ON_CLICK_ACTION_GROUP($event)"
 (valueChange)="onValueChange_ACTION_GROUP($event)"      adaptiveMode="auto" >
		</kendo-multiselecttree>
	</kendo-formfield>
</div>

    </fieldset>
    </form>
    </div>
    <app-dsp-upload (saveCompletedOutput)="this.starServices.att_img_saveFormCompletedHandler($event,this)"
			[setComponentConfig_Input]="DSP_UPLOADConfig">
		</app-dsp-upload>

      <app-dsp-webcam (saveCompletedOutput)="this.starServices.att_img_saveFormCompletedHandler($event,this)"
			[setComponentConfig_Input]="DSP_WEBCAMConfig">
		</app-dsp-webcam>

</kendo-pdf-export>
</div>

<div [hidden]="!showCodeDetails">
	<kendo-dialog 
	(close)="showCodeDetails=false;setlookupArrDef();" resizable="true" [minWidth]="800" [width]="700" [height]="500"
	  title="Add Code">
	  <app-som-tabs-codes-grid 
	  [detail_Input]="grid_som_tabs_codes"  
	  [setComponentConfig_Input]="SOM_TABS_CODESConfig">
	</app-som-tabs-codes-grid>
  
	</kendo-dialog>
  </div>
