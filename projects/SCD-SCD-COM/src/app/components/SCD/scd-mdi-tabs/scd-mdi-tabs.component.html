	
		<!-- scd-appboard.component.html -->
<div class="appboard-container">
  <legend class="k-form-legend screen-legend">
    {{ this.starServices.getNLS([],"scd_appboard.scd_appboard.component_title","SCADA Application") }}
  </legend>

  <!-- Action Bar -->
  <div class="action-bar">
    <button kendoButton [icon]="'hyperlink-open'" (click)="openTab('1')">
      {{ this.starServices.getNLS([],"scd_appboard.scd_appboard.compsTitleID2","Diagram") }}
    </button>
    <button kendoButton [icon]="'hyperlink-open'" (click)="openTab('2')">
      {{ this.starServices.getNLS([],"scd_appboard.scd_appboard.compsTitleID3","Diagram1") }}
    </button>
    <button kendoButton [icon]="'hyperlink-open'" (click)="openTab('3')">
      {{ this.starServices.getNLS([],"scd_appboard.scd_appboard.compsTitleID5","Groups") }}
    </button>
    
    <!-- Group Controls -->
    <button kendoButton [icon]="'plus'" themeColor="primary" (click)="createTabGroup('Group ' + (tabGroups.length + 1))">
      New Group
    </button>
    <button kendoButton [icon]="'close'" (click)="closeAllTabs()">
      Close All
    </button>
    <span class="tab-count">{{ getTotalTabCount() }} tabs</span>
  </div>

  <!-- Tab Host -->
  <div class="tab-host" [class.tab-host-dark]="isDarkTheme">
    
    <!-- ===== GROUP TABS ===== -->
    <div class="group-tabs-container" *ngIf="tabGroups.length > 0">
      <kendo-tabstrip
        [keepTabContent]="true"
        [tabPosition]="'top'"
        [tabAlignment]="'start'"
        (tabSelect)="onGroupTabSelect($event)"
        class="group-tabstrip"
      >
        <kendo-tabstrip-tab 
          *ngFor="let group of tabGroups; let i = index; trackBy: trackGroup"
          [title]="group.title"
          [selected]="group.id === activeGroupId"
          [closable]="false"
          [disabled]="false"
        >
          <ng-template kendoTabTitle>
            <span class="group-tab-title">{{ group.title }}</span>
            <span 
              class="close-group-btn"
              (click)="closeGroup(group.id, $event)"
              (mousedown)="$event.stopPropagation()"
              title="Close Group"
            >
              ×
            </span>
          </ng-template>
          
          <ng-template kendoTabContent>
            <!-- ===== CONTENT FOR SELECTED GROUP ===== -->
            <div class="group-content-area">
              <!-- If group has tabs, show its tabstrip -->
              <div *ngIf="group.tabs && group.tabs.length > 0" class="group-tabs-container">
                <div
                  #groupWrapper
                  [id]="'group-wrapper-' + group.id"
                  kendoDragTargetContainer
                  kendoDropTargetContainer
                  dragTargetFilter=".k-tabstrip-item"
                  dropTargetFilter=".k-tabstrip-item"
                  [dragData]="dragData"
                  [hint]="{ hintClass: 'tabHint' }"
                  (onDrop)="onDrop($event, group.id)"
                  (onDragOver)="onDragOver($event)"
                  (onDragLeave)="clearDropIndicators()"
                  dragHandle=".drag-handle"
                  style="height: 100%;"
                >
                  <kendo-tabstrip
                    [keepTabContent]="true"
                    [tabPosition]="'top'"
                    [tabAlignment]="'start'"
                    (tabSelect)="onGroupTabSelectInternal($event, group.id)"
                    (tabClose)="onGroupTabClose($event, group.id)"
                  >
                    <kendo-tabstrip-tab 
                      *ngFor="let tab of group.tabs; trackBy: trackTab"
                      [title]="tab.title"
                      [selected]="tab.id === group.activeTabId"
                      [disabled]="false"
                      [closable]="tab.closable !== false"
                    >
                      <ng-template kendoTabTitle>
                        <span class="drag-handle" style="cursor: grab; margin-right: 6px; display: inline-block; user-select: none; opacity: 0.5; font-size: 14px;">
                          ⠿
                        </span>
                        <span class="tab-title">{{ tab.title }}</span>
                      </ng-template>
                      
                      <ng-template kendoTabContent>
                        <div class="tab-content">
                          <ng-container *ngComponentOutlet="tab.component; inputs: tab.inputs"></ng-container>
                        </div>
                      </ng-template>
                    </kendo-tabstrip-tab>
                  </kendo-tabstrip>
                </div>
              </div>
              
              <!-- Empty state for group with no tabs -->
              <div *ngIf="!group.tabs || group.tabs.length === 0" class="empty-group-content">
                <span class="empty-icon-small">📂</span>
                <p>No tabs in this group</p>
                <button kendoButton size="small" (click)="addDiagramToGroup(group.id)">
                  Add Diagram
                </button>
              </div>
            </div>
          </ng-template>
        </kendo-tabstrip-tab>
      </kendo-tabstrip>
    </div>

    <!-- ===== SINGLE TAB STRIP (NO GROUPS) ===== -->
    <div class="single-tab-container" *ngIf="tabGroups.length === 0 && tabs.length > 0">
      <div
        #wrapper
        kendoDragTargetContainer
        kendoDropTargetContainer
        dragTargetFilter=".k-tabstrip-item"
        dropTargetFilter=".k-tabstrip-item"
        [dragData]="dragData"
        [hint]="{ hintClass: 'tabHint' }"
        (onDrop)="onDrop($event)"
        (onDragOver)="onDragOver($event)"
        (onDragLeave)="clearDropIndicators()"
        dragHandle=".drag-handle"
        style="height: 100%;"
      >
        <kendo-tabstrip
          [keepTabContent]="true"
          [tabPosition]="'top'"
          [tabAlignment]="'start'"
          (tabSelect)="onTabSelect($event)"
          (tabClose)="onTabClose($event)"
        >
          <kendo-tabstrip-tab 
            *ngFor="let tab of tabs; trackBy: trackTab"
            [title]="tab.title"
            [selected]="isTabSelected(tab.id)"
            [disabled]="false"
            [closable]="tab.closable !== false"
          >
            <ng-template kendoTabTitle>
              <span class="drag-handle" style="cursor: grab; margin-right: 6px; display: inline-block; user-select: none; opacity: 0.5; font-size: 14px;">
                ⠿
              </span>
              <span class="tab-title">{{ tab.title }}</span>
            </ng-template>
            
            <ng-template kendoTabContent>
              <div class="tab-content">
                <ng-container *ngComponentOutlet="tab.component; inputs: tab.inputs"></ng-container>
              </div>
            </ng-template>
          </kendo-tabstrip-tab>
        </kendo-tabstrip>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="tabs.length === 0 && tabGroups.length === 0">
      <div class="empty-state-content">
        <span class="empty-icon">📂</span>
        <h3>No Tabs Open</h3>
        <p>Open a diagram from the buttons above or create a new tab group</p>
      </div>
    </div>
  </div>
</div>
