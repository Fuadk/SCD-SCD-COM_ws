<div>
    <legend *ngIf="componentConfig.showToolBar"  class="k-form-legend">{{
      componentConfig.title ? componentConfig.title :
       this.starServices.getNLS([],"SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.component_title","Tag to Add") }}</legend>
<div class="form-toolbar"> </div>

<kendo-toolbar class="form-toolbar" *ngIf="componentConfig.showToolBar">

 
    <kendo-toolbar-button [icon]="'sliders'" [disabled]="isSearch"  text="{{isPhonePortrait ? null : starServices.getNLS([],'ENTER_QUERY','Filter')}}" title="{{starServices.getNLS([],'ENTER_QUERY','Filter')}}" (click)="enterQuery( form);" *ngIf="componentConfig.queryable"></kendo-toolbar-button>
    <kendo-toolbar-button [icon]="'search'"  title="{{starServices.getNLS([],'EXECUTE_QUERY','Execute Query')}}"  (click)="executeQuery( form.value);" *ngIf="componentConfig.queryable"></kendo-toolbar-button>
    <kendo-toolbar-button  [icon]="'cancel'"  title="{{starServices.getNLS([],'CANCEL','Cancel')}}"  (click)="onCancel($event)" *ngIf="componentConfig.queryable"></kendo-toolbar-button >

    <kendo-toolbar-buttongroup selection="single" *ngIf="starServices.dataExits(this) && (componentConfig.queryable || componentConfig.navigable)">
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-double-60-right' : 'arrow-double-60-left'" title="{{starServices.getNLS([],'FIRST_RECORD','First Record')}}" (click)="goRecord( 'first');" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button>
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-60-right' : 'arrow-60-left'"  title="{{starServices.getNLS([],'PREVIOUS_RECORD','Previous Record')}}"  (click)="goRecord(  'prev');" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button>
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-60-left' : 'arrow-60-right'" title="{{starServices.getNLS([],'NEXT_RECORD','Next Record')}}"  (click)="goRecord('next')" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button >
        <kendo-toolbar-button  [icon]="userLang === 'AR' ? 'arrow-double-60-left' : 'arrow-double-60-right'" title="{{starServices.getNLS([],'LAST_RECORD','Last Record')}}" (click)="goRecord('last')" *ngIf="componentConfig.navigable && !isSearch"></kendo-toolbar-button>
    </kendo-toolbar-buttongroup>

    <kendo-toolbar-button [icon]="'plus'" title="{{starServices.getNLS([],'INSERT_RECORD','Insert Record')}}" (click)="onNew($event);" *ngIf="componentConfig.insertable && !isSearch"></kendo-toolbar-button>

    <kendo-toolbar-button kendoButton [icon]="'save'" title="{{starServices.getNLS([],'SAVE','Save')}}" (click)="saveChanges( form)" *ngIf="(starServices.dataExits(this)|| isNew) && !isChild && componentConfig.updateable && !isSearch"></kendo-toolbar-button>
    <kendo-toolbar-button [icon]="'trash'" title="{{starServices.getNLS([],'DELETE_RECORD','Delete Record')}}" (click)="onRemove( form);" *ngIf=" starServices.dataExits(this) && componentConfig.removeable && !isSearch">Remove</kendo-toolbar-button>

    <kendo-toolbar-button kendoButton  *ngIf="starServices.helpMsg !=='' "  text="{{starServices.helpMsg}}"    ></kendo-toolbar-button>     
</kendo-toolbar>


<kendo-pdf-export #pdf paperSize="A4" margin="2cm">
 <div class="form-borders" > 
    <form class="form-layout" [ngClass]="isPhonePortrait ? 'k-form k-form-horizontal-star' : 'k-form k-form-horizontal' "
     [formGroup]="form" (click)="ON_CLICK(form.value)">
    <!--fieldset class="form-fieldset"  class="k-form-fieldset" [disabled]="!componentConfig.enabled && !isSearch"-->
    <fieldset class="form-fieldset"  class="k-form-fieldset" >


<div [ngClass]="isPhonePortrait || customerFacing ? 'wrapno1' : 'wrap' ">
	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelTAG_IN_MODEL_IDTop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleTAG_IN_MODEL_ID >
		<kendo-label *ngIf="(!labelTAG_IN_MODEL_IDTop && !isPhonePortrait) && labelTAG_IN_MODEL_IDVisible" class="form-label" [for]="TAG_IN_MODEL_ID" [text]="starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.TAG_IN_MODEL_ID','Tag In Model Id') + ' *'"></kendo-label>
		<label *ngIf="(labelTAG_IN_MODEL_IDTop || isPhonePortrait) && labelTAG_IN_MODEL_IDVisible" class="form-label"  >{{starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.TAG_IN_MODEL_ID','Tag In Model Id') + ' *'}}</label>
		<input   formControlName="TAG_IN_MODEL_ID"
 kendoTextBox #TAG_IN_MODEL_ID 
		[readonly]="primarKeyReadOnlyArr.isTAG_IN_MODEL_IDreadOnly" [placeholder]="starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.TAG_IN_MODEL_ID_Hint','Please enter Tag In Model Id.')"
		(click)="ON_CLICK_TAG_IN_MODEL_ID($event)"
[ngClass]="customerFacing ?  'summaryClass' : 'form-input' " (change)="onChange_TAG_IN_MODEL_ID($event)"      adaptiveMode="auto"  />
	</kendo-formfield>

	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelAPPLICATION_IDTop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleAPPLICATION_ID >
		<kendo-label *ngIf="(!labelAPPLICATION_IDTop && !isPhonePortrait) && labelAPPLICATION_IDVisible" class="form-label" [for]="APPLICATION_ID" [text]="starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.APPLICATION_ID','Application Id') + ' *'"></kendo-label>
		<label *ngIf="(labelAPPLICATION_IDTop || isPhonePortrait) && labelAPPLICATION_IDVisible" class="form-label"  >{{starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.APPLICATION_ID','Application Id') + ' *'}}</label>
		<kendo-combobox  #APPLICATION_ID class="form-field-combobox"  [formControlName]="'APPLICATION_ID'"
		[data]="lkpArrAPPLICATION_ID" [textField]="'CODETEXT_LANG'"  [valueField]="'CODE'"

		[ngClass]="{ 'ng-invalid-required  ng-touched': submitted && f.APPLICATION_ID.errors }"  required 
		[readonly]="primarKeyReadOnlyArr.isAPPLICATION_IDreadOnly" [placeholder]="starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.APPLICATION_ID_Hint','Please enter Application Id.')"		(click)="ON_CLICK_APPLICATION_ID($event)"
 (valueChange)="onValueChange_APPLICATION_ID($event)"      adaptiveMode="auto" 
		 (filterChange)="starServices.handleFilterCode(this, $event)" 
		[valuePrimitive]="true"  [kendoDropDownFilter]="{ operator: 'contains' }">
		 <ng-template kendoDropDownListNoDataTemplate>
		 <div> 
		 	<button *ngIf="filterCode" kendoButton (click)="starServices.addNewCode(this, 'APPLICATION_ID')"> 
		 		{{starServices.getNLS([],'ADD_NEW_ITEM','Add new item')}} 
		 	</button> 
		 </div> 
		 </ng-template> 
		</kendo-combobox>
	</kendo-formfield>


</div>
<div [ngClass]="isPhonePortrait || customerFacing ? 'wrapno1' : 'wrap' ">
	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelTAG_IDTop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleTAG_ID >
		<kendo-label *ngIf="(!labelTAG_IDTop && !isPhonePortrait) && labelTAG_IDVisible" class="form-label" [for]="TAG_ID" [text]="starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.TAG_ID','Tag Id') + ' *'"></kendo-label>
		<label *ngIf="(labelTAG_IDTop || isPhonePortrait) && labelTAG_IDVisible" class="form-label"  >{{starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.TAG_ID','Tag Id') + ' *'}}</label>
		<kendo-combobox  #TAG_ID class="form-field-combobox"  [formControlName]="'TAG_ID'"
		[data]="lkpArrTAG_ID" [textField]="'CODETEXT_LANG'"  [valueField]="'CODE'"

		[ngClass]="{ 'ng-invalid-required  ng-touched': submitted && f.TAG_ID.errors }"  required 
		[readonly]="primarKeyReadOnlyArr.isTAG_IDreadOnly" [placeholder]="starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.TAG_ID_Hint','Please enter Tag Id.')"		(click)="ON_CLICK_TAG_ID($event)"
 (valueChange)="onValueChange_TAG_ID($event)"      adaptiveMode="auto" 
		 (filterChange)="starServices.handleFilterCode(this, $event)" 
		[valuePrimitive]="true"  [kendoDropDownFilter]="{ operator: 'contains' }">
		 <ng-template kendoDropDownListNoDataTemplate>
		 <div> 
		 	<button *ngIf="filterCode" kendoButton (click)="starServices.addNewCode(this, 'TAG_ID')"> 
		 		{{starServices.getNLS([],'ADD_NEW_ITEM','Add new item')}} 
		 	</button> 
		 </div> 
		 </ng-template> 
		</kendo-combobox>
	</kendo-formfield>

	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelTAG_NAMETop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleTAG_NAME >
		<kendo-label *ngIf="(!labelTAG_NAMETop && !isPhonePortrait) && labelTAG_NAMEVisible" class="form-label" [for]="TAG_NAME" [text]="starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.TAG_NAME','Tag Name')"></kendo-label>
		<label *ngIf="(labelTAG_NAMETop || isPhonePortrait) && labelTAG_NAMEVisible" class="form-label"  >{{starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.TAG_NAME','Tag Name')}}</label>
		<input   formControlName="TAG_NAME"
 kendoTextBox #TAG_NAME  [placeholder]="starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.TAG_NAME_Hint','Please enter Tag Name.')"
		(click)="ON_CLICK_TAG_NAME($event)"
[ngClass]="customerFacing ?  'summaryClass' : 'form-input' " (change)="onChange_TAG_NAME($event)"      adaptiveMode="auto"  />
	</kendo-formfield>


</div>
<div [ngClass]="isPhonePortrait || customerFacing ? 'wrapno1' : 'wrap' ">
	<kendo-formfield class="form-field" [orientation]="'horizontal'" [ngClass]="(labelTAG_TYPETop || (isPhonePortrait && !customerFacing) ) ? 'displayBlock' : 'standard' "  *ngIf=visibleTAG_TYPE >
		<kendo-label *ngIf="(!labelTAG_TYPETop && !isPhonePortrait) && labelTAG_TYPEVisible" class="form-label" [for]="TAG_TYPE" [text]="starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.TAG_TYPE','Tag Type')"></kendo-label>
		<label *ngIf="(labelTAG_TYPETop || isPhonePortrait) && labelTAG_TYPEVisible" class="form-label"  >{{starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.TAG_TYPE','Tag Type')}}</label>
		<input   formControlName="TAG_TYPE"
 kendoTextBox #TAG_TYPE  [placeholder]="starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.TAG_TYPE_Hint','Please enter Tag Type.')"
		(click)="ON_CLICK_TAG_TYPE($event)"
[ngClass]="customerFacing ?  'summaryClass' : 'form-input' " (change)="onChange_TAG_TYPE($event)"      adaptiveMode="auto"  />
	</kendo-formfield>


</div>
<div [ngClass]="isPhonePortrait || customerFacing ? 'wrapno1' : 'wrap' ">
		<button  (valueChange)="onValueChange_ADD_TAG($event)"  style="margin-left : 10px ;"    adaptiveMode="auto" 		 class="k-button k-primary" kendoButton  
		 title="starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.ADD_TAG_Hint','Please enter Add Tag.')" 
 iconClass="fas fa-plus"  *ngIf=visibleADD_TAG 		(click)="ON_CLICK_ADD_TAG($event)"
 >{{starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.ADD_TAG','Add Tag')}}</button>

		<button  (valueChange)="onValueChange_REMOVE_TAG($event)"  style="margin-left : 10px ;"    adaptiveMode="auto" 		 class="k-button k-primary" kendoButton  
		 title="starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.REMOVE_TAG_Hint','Please enter Remove Tag.')" 
 iconClass="fas fa-minus"  *ngIf=visibleREMOVE_TAG 		(click)="ON_CLICK_REMOVE_TAG($event)"
 >{{starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.REMOVE_TAG','Remove Tag')}}</button>

		<button  (valueChange)="onValueChange_REMOVE_ALL($event)"  style="margin-left : 10px ;"    adaptiveMode="auto" 		 class="k-button k-primary" kendoButton  
		 title="starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.REMOVE_ALL_Hint','Please enter Remove All.')" 
 iconClass="fas fa-trash"  *ngIf=visibleREMOVE_ALL 		(click)="ON_CLICK_REMOVE_ALL($event)"
 >{{starServices.getNLS([],'SCD_TIM_TAG_TO_ADD.scdtagInModelScdTimTagToAdd.REMOVE_ALL','Remove All')}}</button>
</div>

    </fieldset>
    </form>
    </div>
    <app-dsp-upload (saveCompletedOutput)="this.starServices.att_img_saveFormCompletedHandler($event,this)"
			[setComponentConfig_Input]="DSP_UPLOADConfig">
		</app-dsp-upload>

      <app-dsp-webcam (saveCompletedOutput)="this.starServices.att_img_saveFormCompletedHandler($event,this)"
			[setComponentConfig_Input]="DSP_WEBCAMConfig">
		</app-dsp-webcam>

</kendo-pdf-export>
</div>

<div [hidden]="!showCodeDetails">
	<kendo-dialog 
	(close)="showCodeDetails=false;setlookupArrDef();" resizable="true" [minWidth]="800" [width]="700" [height]="500"
	  title="Add Code">
	  <app-som-tabs-codes-grid 
	  [detail_Input]="grid_som_tabs_codes"  
	  [setComponentConfig_Input]="SOM_TABS_CODESConfig">
	</app-som-tabs-codes-grid>
  
	</kendo-dialog>
  </div>
